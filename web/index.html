<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Blizzard Simulator</title>
<style>
  body {
    background: #111;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
</style>
</head>
<body>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("blizzardsim.wasm"), go.importObject)
    .then(result => go.run(result.instance));
</script>
</body>
</html>
